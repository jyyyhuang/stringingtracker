<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>🏸 Cat Feeding Form 🏸</title>

<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* =========================
   BACKGROUND
========================= */

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;

  font-family: "Open Sans", sans-serif;

  background:
    linear-gradient(
      rgba(244,246,251,0.70),
      rgba(244,246,251,0.82)
    ),
    url("image.png");

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

/* =========================
   APP
========================= */

.app {
  max-width: 520px;
  height: 100dvh;
  margin: 0 auto;

  display: flex;
  flex-direction: column;
}

.header {
  text-align: center;

  font-size: 24px;
  font-weight: 800;

  padding: 14px;

  color: #1f2937;

  text-shadow:
    0 1px 2px rgba(255,255,255,0.45);

  flex-shrink: 0;
}

/* =========================
   CONTENT
========================= */

.content {
  flex: 1;

  overflow-y: auto;
  overflow-x: visible;

  padding: 8px;

  display: flex;
  flex-direction: column;
  gap: 8px;

  position: relative;
}

/* =========================
   CARDS
========================= */

.card {

  background:
    rgba(255,255,255,0.90);

  backdrop-filter:
    blur(10px);

  border-radius: 16px;

  padding: 12px;

  box-shadow:
    0 6px 18px rgba(0,0,0,0.08);

  position: relative;

  overflow: visible;
}

.row {
  display: flex;
  gap: 8px;
}

.row > div {
  flex: 1;
}

/* =========================
   LABELS
========================= */

label {

  font-size: 12px;
  font-weight: 700;

  margin-bottom: 6px;

  display: block;

  color: #4b5563;

  letter-spacing: 0.2px;
}

/* =========================
   INPUTS
========================= */

input,
select,
textarea {

  width: 100%;

  padding: 12px 14px;

  font-size: 16px;
  font-weight: 600;

  color: #111827;

  border-radius: 12px;

  border:
    1px solid rgba(0,0,0,0.08);

  background:
    rgba(255,255,255,0.97);

  outline: none;

  appearance: none;
  -webkit-appearance: none;

  transition:
    border-color 0.15s ease,
    box-shadow 0.15s ease;
}

input::placeholder,
textarea::placeholder {
  color: #9ca3af;
  font-weight: 500;
}

input:focus,
select:focus,
textarea:focus {

  border-color: #8ea8ff;

  box-shadow:
    0 0 0 4px rgba(122,167,255,0.16);

  background: white;
}

textarea {
  min-height: 70px;
  resize: none;
}

/* =========================
   SELECT FIX
========================= */

select {

  cursor: pointer;

  background-image:
    linear-gradient(45deg, transparent 50%, #555 50%),
    linear-gradient(135deg, #555 50%, transparent 50%);

  background-position:
    calc(100% - 18px) calc(50% - 3px),
    calc(100% - 12px) calc(50% - 3px);

  background-size: 6px 6px;

  background-repeat: no-repeat;

  padding-right: 38px;
}

option {
  color: #111;
  background: white;
  font-weight: 600;
}

/* =========================
   FOOTER
========================= */

.footer {

  padding: 10px;

  display: flex;
  flex-direction: column;
  gap: 8px;

  flex-shrink: 0;
}

button {

  width: 100%;

  border: none;

  border-radius: 14px;

  padding: 14px;

  font-size: 17px;
  font-weight: 800;
}

.submitBtn {

  background:
    linear-gradient(
      135deg,
      #7aa7ff,
      #b7a6ff
    );

  color: white;

  box-shadow:
    0 6px 14px rgba(122,167,255,0.25);
}

.clearBtn {

  background:
    rgba(255,255,255,0.92);

  color: #333;
}

.msg {
  text-align: center;
  font-size: 12px;
  color: #444;
}

/* =========================
   AUTOCOMPLETE
========================= */

.autocomplete {

  position: relative;

  z-index: 9999;

  overflow: visible !important;
}

.suggestions {

  position: absolute;

  top: calc(100% + 6px);

  left: 0;
  right: 0;

  background:
    rgba(255,255,255,0.99);

  border-radius: 14px;

  box-shadow:
    0 10px 28px rgba(0,0,0,0.18);

  max-height: 260px;

  overflow-y: auto;

  display: none;

  z-index: 99999;

  backdrop-filter: blur(12px);

  border:
    1px solid rgba(255,255,255,0.7);
}

.suggestions div {

  padding: 14px;

  border-bottom:
    1px solid rgba(0,0,0,0.05);

  font-size: 15px;
  font-weight: 600;

  color: #111827;

  background: white;

  cursor: pointer;
}

.suggestions div:hover {
  background: #f3f6ff;
}

.suggestions div:last-child {
  border-bottom: none;
}

/* =========================
   IOS FIXES
========================= */

input,
select,
textarea,
button {
  transform: translateZ(0);
}

</style>

</head>

<body>

<div class="app">

<div class="header">
🏸 Cat Feeding Form 🏸
</div>

<form id="form" onsubmit="return false;">

<div class="content">

<div class="card autocomplete">

<label>Name</label>

<input id="name" autocomplete="off" placeholder="Enter customer name">

<div id="suggestions" class="suggestions"></div>

</div>

<div class="card row">

<div>
<label>Club</label>
<input id="club" placeholder="Club">
</div>

<div>
<label>Racket</label>
<input id="racket" placeholder="Racket">
</div>

</div>

<div class="card row">

<div>
<label>String</label>
<input id="string" placeholder="String">
</div>

<div>
<label>Tension</label>
<input id="tension" placeholder="Tension">
</div>

</div>

<div class="card row">

<div>
<label>Paid</label>
<select id="paid">
<option>Yes</option>
<option>Pending</option>
</select>
</div>

<div>
<label>Type</label>
<select id="type">
<option value="">—</option>
<option value="1 String">1 String</option>
<option value="Cross -1">Cross -1</option>
</select>
</div>

</div>

<div class="card">

<label>Notes</label>
<textarea id="notes" placeholder="Notes..."></textarea>

</div>

</div>

<div class="footer">

<button class="submitBtn" type="button" id="submitBtn">Submit</button>
<button class="clearBtn" type="button" id="clearBtn">Clear Form</button>

<div class="msg" id="msg"></div>

</div>

</form>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbx6cJSMpg10QLMqotk2Gm2xSf5TO9ZjxT1QxHIM_CrY7xdJbrRgL9sdzjKoNg3PHwT6SQ/exec";

const API_KEY = "my-secret-key";

const el = {
  name: document.getElementById("name"),
  club: document.getElementById("club"),
  racket: document.getElementById("racket"),
  string: document.getElementById("string"),
  tension: document.getElementById("tension"),
  paid: document.getElementById("paid"),
  type: document.getElementById("type"),
  notes: document.getElementById("notes"),
  form: document.getElementById("form"),
  msg: document.getElementById("msg"),
  suggestions: document.getElementById("suggestions"),
  clearBtn: document.getElementById("clearBtn")
};

function api(params) {
  return fetch(API_URL + "?" + new URLSearchParams({
    key: API_KEY,
    ...params
  })).then(r => r.json());
}

/* =========================
   DEBOUNCE + RACE CONTROL
========================= */

let debounceTimer = null;
let latestRequestId = 0;
let suppressAutocomplete = false;

/* =========================
   SEARCH (DEBOUNCED)
========================= */

el.name.addEventListener("input", () => {

  if (suppressAutocomplete) return;

  clearTimeout(debounceTimer);

  debounceTimer = setTimeout(() => {

    const q = el.name.value.trim();

    if (!q) {
      el.suggestions.style.display = "none";
      return;
    }

    const requestId = ++latestRequestId;

    api({ action: "searchClients", query: q })
      .then(data => {

        if (requestId !== latestRequestId) return;

        renderResults(data);

      });

  }, 300);

});

/* =========================
   RENDER
========================= */

function renderResults(list) {

  el.suggestions.innerHTML = "";

  const cleaned = (list || []).filter(n =>
    n && n.toLowerCase() !== "recent"
  );

  if (!cleaned.length) {
    el.suggestions.style.display = "none";
    return;
  }

  cleaned.slice(0, 8).forEach(n => {

    const div = document.createElement("div");
    div.textContent = n;

    div.onclick = () => {

      suppressAutocomplete = true;
      latestRequestId++;

      el.name.value = n;
      el.suggestions.style.display = "none";

      load(n);

      setTimeout(() => suppressAutocomplete = false, 200);

    };

    el.suggestions.appendChild(div);

  });

  el.suggestions.style.display = "block";
}

/* =========================
   LOAD
========================= */

async function load(nameVal) {

  const d = await api({
    action: "getClientHistory",
    name: nameVal
  });

  if (!d) return;

  el.club.value = d.club || "";
  el.racket.value = d.racket || "";
  el.string.value = d.strings || "";
  el.tension.value = d.tension || "";
}

/* =========================
   DATE FORMAT FIX
========================= */

function formatDDMMYYYY(date) {
  const dd = String(date.getDate()).padStart(2, "0");
  const mm = String(date.getMonth() + 1).padStart(2, "0");
  const yyyy = date.getFullYear();
  return `${dd}/${mm}/${yyyy}`;
}

/* =========================
   SUBMIT
========================= */

document.getElementById("submitBtn")
.addEventListener("click", async () => {

  el.msg.innerText = "Submitting...";

  const payload = {

    action: "submit",

    client_name: el.name.value,
    club: el.club.value,
    racquet_name: el.racket.value,
    strings: el.string.value,
    tension: el.tension.value,
    paid: el.paid.value,
    special_case: el.type.value,
    notes: el.notes.value,

    handover_date: formatDDMMYYYY(new Date())

  };

  try {

    const res = await api(payload);

    el.msg.innerText = payload.client_name + " saved";

    el.form.reset();
    el.suggestions.style.display = "none";

  } catch (err) {

    el.msg.innerText = "Submission failed";

  }

});

/* =========================
   CLEAR
========================= */

el.clearBtn.addEventListener("click", () => {

  el.form.reset();

  el.msg.innerText = "Cleared";

  el.suggestions.style.display = "none";

});

</script>

</body>
</html>
