<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>🏸 Cat Feeding Form 🏸</title>

<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* =========================
   BACKGROUND
========================= */

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  font-family: "Open Sans", sans-serif;

  background:
    linear-gradient(
      rgba(244,246,251,0.72),
      rgba(244,246,251,0.82)
    ),
    url("image.png");

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

/* =========================
   APP
========================= */

.app {
  max-width: 520px;
  height: 100dvh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
}

.header {
  text-align: center;
  font-size: 24px;
  font-weight: 800;
  padding: 14px;
  color: #1f2937;
  text-shadow: 0 1px 2px rgba(255,255,255,0.4);
}

/* =========================
   CONTENT
========================= */

.content {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* =========================
   CARD
========================= */

.card {
  background: rgba(255,255,255,0.88);
  backdrop-filter: blur(10px);
  border-radius: 16px;
  padding: 12px;

  box-shadow:
    0 6px 18px rgba(0,0,0,0.08);
}

.row {
  display: flex;
  gap: 8px;
}

.row > div {
  flex: 1;
}

/* =========================
   LABELS
========================= */

label {
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 6px;
  display: block;
  color: #4b5563;
  letter-spacing: 0.2px;
}

/* =========================
   INPUTS
========================= */

input,
select,
textarea {
  width: 100%;

  padding: 12px 14px;

  font-size: 16px;
  font-weight: 600;
  color: #1f2937;

  border-radius: 12px;
  border: 1px solid rgba(0,0,0,0.08);

  background: rgba(255,255,255,0.96);

  outline: none;

  appearance: none;
  -webkit-appearance: none;

  box-shadow:
    inset 0 1px 2px rgba(0,0,0,0.03);

  transition:
    border-color 0.15s ease,
    box-shadow 0.15s ease,
    background 0.15s ease;
}

/* placeholders */

input::placeholder,
textarea::placeholder {
  color: #9ca3af;
  font-weight: 500;
}

/* focus */

input:focus,
select:focus,
textarea:focus {

  border-color: #8ea8ff;

  box-shadow:
    0 0 0 4px rgba(122,167,255,0.16);

  background: white;
}

/* textarea */

textarea {
  min-height: 70px;
  resize: none;
}

/* =========================
   SELECT DROPDOWN FIX
========================= */

select {

  cursor: pointer;

  background-image:
    linear-gradient(45deg, transparent 50%, #666 50%),
    linear-gradient(135deg, #666 50%, transparent 50%);

  background-position:
    calc(100% - 18px) calc(50% - 3px),
    calc(100% - 12px) calc(50% - 3px);

  background-size: 6px 6px;

  background-repeat: no-repeat;

  padding-right: 38px;
}

/* dropdown options */

option {
  color: #111;
  background: white;
  font-weight: 600;
}

/* =========================
   FOOTER
========================= */

.footer {
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

button {
  width: 100%;
  border: none;
  border-radius: 14px;
  padding: 14px;
  font-size: 17px;
  font-weight: 800;
}

.submitBtn {
  background:
    linear-gradient(
      135deg,
      #7aa7ff,
      #b7a6ff
    );

  color: white;

  box-shadow:
    0 6px 14px rgba(122,167,255,0.25);
}

.clearBtn {
  background: rgba(255,255,255,0.9);
  color: #333;
}

.msg {
  text-align: center;
  font-size: 12px;
  color: #444;
}

/* =========================
   AUTOCOMPLETE
========================= */

.autocomplete {
  position: relative;
}

.suggestions {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;

  background: rgba(255,255,255,0.98);

  border-radius: 12px;

  box-shadow:
    0 6px 18px rgba(0,0,0,0.12);

  max-height: 220px;
  overflow-y: auto;

  display: none;
  z-index: 1000;

  backdrop-filter: blur(10px);
}

.suggestions div {
  padding: 12px;
  border-bottom: 1px solid #eee;
  font-size: 14px;
  font-weight: 600;
}

.suggestions div:last-child {
  border-bottom: none;
}

.section-title {
  font-size: 11px;
  color: #888;
  padding: 8px 12px;
  background: #fafafa;
  font-weight: 700;
}

</style>

</head>

<body>

<div class="app">

<div class="header">
🏸 Cat Feeding Form 🏸
</div>

<form id="form" onsubmit="return false;">

<div class="content">

<div class="card autocomplete">

<label>Name</label>

<input
id="name"
autocomplete="off"
placeholder="Enter customer name">

<div
id="suggestions"
class="suggestions">
</div>

</div>

<div class="card row">

<div>
<label>Club</label>
<input
id="club"
placeholder="Club">
</div>

<div>
<label>Racket</label>
<input
id="racket"
placeholder="Racket">
</div>

</div>

<div class="card row">

<div>
<label>String</label>
<input
id="string"
placeholder="String">
</div>

<div>
<label>Tension</label>
<input
id="tension"
placeholder="Tension">
</div>

</div>

<div class="card row">

<div>

<label>Paid</label>

<select id="paid">
<option>Yes</option>
<option>Pending</option>
</select>

</div>

<div>

<label>Type</label>

<select id="type">
<option value="">—</option>
<option value="1 String">1 String</option>
<option value="Cross -1">Cross -1</option>
</select>

</div>

</div>

<div class="card">

<label>Notes</label>

<textarea
id="notes"
placeholder="Notes..."></textarea>

</div>

</div>

<div class="footer">

<button
class="submitBtn"
type="button"
id="submitBtn">
Submit
</button>

<button
class="clearBtn"
type="button"
id="clearBtn">
Clear Form
</button>

<div
class="msg"
id="msg"></div>

</div>

</form>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbx6cJSMpg10QLMqotk2Gm2xSf5TO9ZjxT1QxHIM_CrY7xdJbrRgL9sdzjKoNg3PHwT6SQ/exec";

const API_KEY = "my-secret-key";

/* =========================
   ELEMENTS
========================= */

const el = {

  name:
    document.getElementById("name"),

  club:
    document.getElementById("club"),

  racket:
    document.getElementById("racket"),

  string:
    document.getElementById("string"),

  tension:
    document.getElementById("tension"),

  paid:
    document.getElementById("paid"),

  type:
    document.getElementById("type"),

  notes:
    document.getElementById("notes"),

  form:
    document.getElementById("form"),

  msg:
    document.getElementById("msg"),

  suggestions:
    document.getElementById("suggestions"),

  clearBtn:
    document.getElementById("clearBtn")
};

/* =========================
   DISABLE ENTER SUBMIT
========================= */

document.addEventListener("keydown", (e) => {

  if (e.key !== "Enter") return;

  const tag =
    document.activeElement.tagName.toLowerCase();

  if (tag === "textarea") return;

  e.preventDefault();
  e.stopPropagation();

  return false;

});

el.form.addEventListener("submit", (e) => {
  e.preventDefault();
  return false;
});

/* =========================
   API
========================= */

function api(params) {

  const url =
    API_URL + "?" +
    new URLSearchParams({
      key: API_KEY,
      ...params
    });

  return fetch(url)
    .then(r => r.json());

}

/* =========================
   RECENTS
========================= */

let recentCustomers =
JSON.parse(
  localStorage.getItem("recent_customers") || "[]"
);

function updateRecents(name) {

  if (!name) return;

  recentCustomers =
    recentCustomers.filter(n => n !== name);

  recentCustomers.unshift(name);

  recentCustomers =
    recentCustomers.slice(0, 8);

  localStorage.setItem(
    "recent_customers",
    JSON.stringify(recentCustomers)
  );

}

/* =========================
   AUTOCOMPLETE
========================= */

let suppressAutocomplete = false;

el.name.addEventListener("focus", () => {
  renderList(el.name.value.trim());
});

el.name.addEventListener("input", () => {

  if (suppressAutocomplete) return;

  const q = el.name.value.trim();

  renderList(q);

});

function renderList(query) {

  el.suggestions.innerHTML = "";

  let results = [];

  if (!query) {

    results = recentCustomers;

  } else {

    results =
      recentCustomers.filter(n =>
        n.toLowerCase()
         .includes(query.toLowerCase())
      );

  }

  if (results.length === 0 && query) {

    api({
      action: "searchClients",
      query
    }).then(data => {
      renderAPI(data);
    });

    return;
  }

  renderLocal(results);

}

function renderLocal(list) {
  renderListUI(list, true);
}

function renderAPI(list) {
  renderListUI(list, false);
}

function renderListUI(list, isLocal) {

  el.suggestions.innerHTML = "";

  if (!list?.length) {

    el.suggestions.style.display = "none";
    return;

  }

  el.suggestions.innerHTML =
    "<div class='section-title'>" +
    (isLocal ? "Recent" : "Search Results") +
    "</div>";

  list.slice(0, 8).forEach(n => {

    const div =
      document.createElement("div");

    div.textContent = n;

    div.onclick = () => {

      suppressAutocomplete = true;

      el.name.value = n;

      el.suggestions.style.display = "none";

      load(n);

      updateRecents(n);

      setTimeout(() => {
        suppressAutocomplete = false;
      }, 200);

    };

    el.suggestions.appendChild(div);

  });

  el.suggestions.style.display = "block";

}

el.name.addEventListener("blur", () => {

  setTimeout(() => {
    el.suggestions.style.display = "none";
  }, 120);

});

/* =========================
   PREFILL
========================= */

async function load(nameVal) {

  el.club.value = "";
  el.racket.value = "";
  el.string.value = "";
  el.tension.value = "";
  el.type.value = "";

  const cached =
    JSON.parse(
      localStorage.getItem(
        "history_" + nameVal
      ) || "null"
    );

  if (cached) {

    fill(cached);
    return;

  }

  const d = await api({
    action: "getClientHistory",
    name: nameVal
  });

  if (!d) return;

  localStorage.setItem(
    "history_" + nameVal,
    JSON.stringify(d)
  );

  fill(d);

}

function fill(d) {

  el.club.value = d.club || "";
  el.racket.value = d.racket || "";
  el.string.value = d.strings || "";
  el.tension.value = d.tension || "";
  el.type.value = d.special_case || "";

}

/* =========================
   SUBMIT
========================= */

document
.getElementById("submitBtn")
.addEventListener("click", async () => {

  el.msg.innerText = "Submitting...";

  const payload = {

    action: "submit",

    client_name: el.name.value,
    club: el.club.value,
    racquet_name: el.racket.value,
    strings: el.string.value,
    tension: el.tension.value,
    paid: el.paid.value,
    special_case: el.type.value,
    notes: el.notes.value

  };

  try {

    const res = await api(payload);

    if (res?.error) {

      el.msg.innerText = res.error;
      return;

    }

    el.msg.innerText =
      payload.client_name + " saved";

    updateRecents(payload.client_name);

    el.form.reset();

    el.suggestions.style.display = "none";

  } catch (err) {

    el.msg.innerText = "Submission failed";

  }

});

/* =========================
   CLEAR
========================= */

el.clearBtn.addEventListener("click", () => {

  el.form.reset();

  el.msg.innerText = "Cleared";

  el.suggestions.style.display = "none";

});

</script>

</body>
</html>
